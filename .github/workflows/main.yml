name: TP02 - Tests Python 
 
on: 
  push: 
  pull_request: 
    branches: [main] 
 
permissions: 
  contents: read 
 
jobs: 
  tests-mathematiques: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Recuperer le code 
        uses: actions/checkout@v6 
      - name: Installer Python 
        uses: actions/setup-python@v6 
        with: 
          python-version: '3.12' 
      - name: Executer les tests 
        run: python test_calcul.py 
